<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditoría Retail</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="auditoria-manifest.json">
<link rel="icon" href="auditoria-icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0f172a;color:#e2e8f0;padding-bottom:90px}
header{background:#1d4ed8;padding:16px;text-align:center;font-weight:700;color:#fff;font-size:1.2rem}
.tabs{display:flex;background:#1e293b;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:14px;background:none;border:0;border-bottom:3px solid transparent;color:#94a3b8;font-weight:700;font-size:1rem}
.tab.on{color:#fff;border-bottom-color:#60a5fa}
.pg{display:none;padding:14px;max-width:600px;margin:0 auto}.pg.on{display:block}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:14px}
h2{color:#93c5fd;margin:6px 0 10px;font-size:1.05rem}
label{display:block;margin-top:10px;font-weight:600;color:#94a3b8;font-size:.9rem}
input,textarea{width:100%;padding:12px;border:1px solid #334155;border-radius:8px;margin-top:6px;font-size:1rem;background:#0f172a;color:#e2e8f0}
.btn{width:100%;padding:14px;border:0;border-radius:8px;font-weight:700;margin-top:12px;font-size:1rem;color:#fff}
.g{background:#059669}.b{background:#2563eb}.x{background:#64748b}.r{background:#dc2626}
.row{display:flex;gap:10px}.row>div{flex:1}
.chk{background:#0f172a;border:1px solid #334155;border-left:5px solid #059669;border-radius:10px;padding:12px;margin-bottom:10px}
.chk.falla{border-left-color:#dc2626}
.chk b{display:block;margin-bottom:8px}
.sw{display:flex;gap:8px}
.sw button{flex:1;padding:12px;border-radius:8px;border:2px solid #334155;background:#1e293b;color:#94a3b8;font-weight:700;font-size:.95rem}
.sw .ok.on{background:#059669;border-color:#059669;color:#fff}
.sw .no.on{background:#dc2626;border-color:#dc2626;color:#fff}
.ev{display:none;margin-top:10px}.chk.falla .ev{display:block}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos div{position:relative;width:84px;height:84px}
.fotos img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.fotos button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:#dc2626;color:#fff;font-weight:700}
.add{margin-top:8px;padding:12px;width:100%;border:2px dashed #60a5fa;border-radius:8px;background:none;color:#93c5fd;font-weight:700;font-size:.95rem}
canvas{width:100%;height:150px;background:#fff;border:2px dashed #334155;border-radius:8px;margin-top:8px;touch-action:none;display:block}
.it{border-bottom:1px solid #334155;padding:12px 0}
.it small{color:#94a3b8}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.8rem;font-weight:700;margin-left:6px}
.tag.ok{background:#059669}.tag.no{background:#dc2626}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:14px;border-radius:10px;font-weight:700;text-align:center;color:#fff;display:none;z-index:50}
#imp{display:none}
#ins{display:none;margin:0;border-radius:0;background:#f59e0b;color:#000}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body>*:not(#imp){display:none!important}
 body{background:#fff;padding:0}
 #imp{display:block;color:#000;padding:10px;font-family:Arial,sans-serif}
 #imp h1{font-size:18px;text-align:center;margin-bottom:6px;color:#1d4ed8}
 #imp p{font-size:12px;margin:2px 0}
 #imp table{width:100%;border-collapse:collapse;margin:12px 0}
 #imp td,#imp th{border:1px solid #333;padding:6px;font-size:12px;text-align:left}
 #imp th{background:#dbeafe}
 #imp .c{color:#047857;font-weight:700}#imp .f{color:#b91c1c;font-weight:700}
 #imp .ph img{height:110px;margin:4px 4px 0 0;border:1px solid #333}
 #imp .fi{height:70px;margin-top:6px}
 #imp .lg{display:block;margin:0 auto 8px;height:95px;opacity:.5}
}
</style>
</head>
<body>
<button id="ins" class="btn" onclick="instalar()">📲 Instalar como aplicación</button>
<header>📋 Auditoría Retail</header>
<div class="tabs">
 <button class="tab on" onclick="cambiar('nueva',this)">Nueva</button>
 <button class="tab" onclick="cambiar('historial',this)">Historial</button>
</div>

<div id="nueva" class="pg on">
 <div class="card">
  <h2>📍 Datos de la visita</h2>
  <label>Nombre de la tienda</label>
  <input id="tienda" placeholder="Ej: Tricot Costanera Center">
  <div class="row">
   <div><label>Ciudad</label><input id="ciudad" placeholder="Santiago"></div>
   <div><label>Fecha</label><input type="date" id="fecha"></div>
  </div>
 </div>
 <div class="card" id="checks"></div>
 <div class="card">
  <h2>📝 Observaciones</h2>
  <div class="row" style="align-items:flex-start"><textarea id="obs" rows="3" placeholder="Detalles generales de la visita..." style="flex:1"></textarea><button class="btn b" style="flex:0 0 56px;margin-top:4px" onclick="dictar('obs')">🎤</button></div>
  <h2 style="margin-top:16px">✍️ Firma del auditor</h2>
  <canvas id="cv"></canvas>
  <button class="btn x" onclick="limpiarFirma(true)">🗑️ Borrar firma</button>
  <button class="btn g" onclick="guardar()">💾 Guardar auditoría</button>
  <button class="btn b" onclick="pdfActual()">📄 Generar PDF</button>
 </div>
</div>

<div id="historial" class="pg">
 <div class="card">
  <h2>📚 Historial</h2>
  <div id="lista"></div>
  <button class="btn r" onclick="borrarTodo()">Borrar todo el historial</button>
 </div>
</div>

<div id="imp"></div>
<div id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">

<script>
const $=id=>document.getElementById(id);
const ITEMS=[
 ['contratos','Contratos y finiquitos al día','📄 Documentación laboral'],
 ['sueldos','Liquidaciones firmadas',null],
 ['asistencia','Libro de asistencia',null],
 ['caja','Cuadre de caja diario','💰 Caja y finanzas'],
 ['boletas','Boletas y facturas archivadas',null],
 ['extintor','Extintor vigente','🛡️ Prevención de riesgos'],
 ['botiquin','Botiquín completo',null]
];
const est={}, fotos={}, notas={};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Toast: un solo aviso a la vez; el último manda
let tt;
function aviso(msg,color){const t=$('toast');t.textContent=msg;t.style.background=color||'#059669';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600);}

// Dictado por voz (Chrome en Android; necesita internet)
function dictar(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){aviso('Este navegador no permite dictado. Escribe el texto.','#dc2626');return}
 try{const r=new R();r.lang='es-CL';r.interimResults=false;
  r.onresult=e=>{const el=$(id);el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript;el.dispatchEvent(new Event('input'))};
  r.onerror=()=>aviso('No se pudo escuchar. Revisa el permiso del micrófono.','#dc2626');
  r.start();aviso('Escuchando... habla ahora','#2563eb')}catch(e){aviso('Dictado no disponible','#dc2626')}}
// Ubicación GPS al guardar
function ubicacion(){return new Promise(res=>{if(!navigator.geolocation){res(null);return}
 navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),h:new Date().toLocaleString('es-CL')}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0})})}
// Fecha local (no UTC)
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(f){const p=(f||'').split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:f;}

// Tarjetas de verificación
function armar(){
 let h='';
 ITEMS.forEach(([k,t,sec])=>{
  est[k]='Cumple';fotos[k]=[];notas[k]='';
  if(sec)h+=`<h2 style="margin-top:14px">${sec}</h2>`;
  h+=`<div class="chk" id="c_${k}"><b>${t}</b>
  <div class="sw"><button class="ok on" onclick="setE('${k}','Cumple')">✔ Cumple</button><button class="no" onclick="setE('${k}','Falla')">✘ Falla</button></div>
  <div class="ev"><div class="row"><input id="n_${k}" placeholder="¿Qué falla se encontró?" oninput="notas['${k}']=this.value" style="flex:1"><button class="btn b" style="flex:0 0 56px;margin:4px 0 0" onclick="dictar('n_${k}')">🎤</button></div>
  <div class="fotos" id="f_${k}"></div>
  <button class="add" onclick="foto('${k}')">📷 Agregar foto de evidencia</button></div></div>`;
 });
 $('checks').innerHTML=h.replace('<h2 style="margin-top:14px">','<h2>');
}
function setE(k,v){
 est[k]=v;const c=$('c_'+k);c.classList.toggle('falla',v==='Falla');
 c.querySelector('.ok').classList.toggle('on',v==='Cumple');c.querySelector('.no').classList.toggle('on',v==='Falla');
}
function pintarFotos(k){
 $('f_'+k).innerHTML=fotos[k].map((s,i)=>`<div><img src="${s}"><button onclick="quitarFoto('${k}',${i})">×</button></div>`).join('');
}
function quitarFoto(k,i){fotos[k].splice(i,1);pintarFotos(k);}
let kFoto=null;
function foto(k){if(fotos[k].length>=3){aviso('Máximo 3 fotos por punto','#dc2626');return;}kFoto=k;$('cam').value='';$('cam').click();}
$('cam').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f||!kFoto)return;const k=kFoto;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const m=640,s=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  fotos[k].push(c.toDataURL('image/jpeg',0.6));pintarFotos(k);aviso('Foto agregada');
 };im.onerror=()=>aviso('No se pudo leer la foto','#dc2626');im.src=r.result;};
 r.readAsDataURL(f);
});

// Firma que no se borra al cambiar tamaño
const cv=$('cv'),cx=cv.getContext('2d');
let dib=false,lx=0,ly=0,firmado=false;
function ajustar(){
 const r=cv.getBoundingClientRect();if(r.width<10)return;
 if(Math.round(r.width)===cv.width&&Math.round(r.height)===cv.height)return;
 let img=null;if(firmado){img=new Image();img.src=cv.toDataURL();}
 cv.width=Math.round(r.width);cv.height=Math.round(r.height);
 cx.strokeStyle='#000';cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';
 if(img)img.onload=()=>cx.drawImage(img,0,0,cv.width,cv.height);
}
function pos(e){const r=cv.getBoundingClientRect();const p=e.touches&&e.touches[0]?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
function ini(e){e.preventDefault();ajustar();dib=true;firmado=true;const p=pos(e);lx=p.x;ly=p.y;}
function mov(e){if(!dib)return;e.preventDefault();const p=pos(e);cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(p.x,p.y);cx.stroke();lx=p.x;ly=p.y;}
function fin(e){dib=false;}
cv.addEventListener('mousedown',ini);cv.addEventListener('mousemove',mov);window.addEventListener('mouseup',fin);
cv.addEventListener('touchstart',ini,{passive:false});cv.addEventListener('touchmove',mov,{passive:false});cv.addEventListener('touchend',fin);
window.addEventListener('resize',ajustar);
function limpiarFirma(av){cx.clearRect(0,0,cv.width,cv.height);firmado=false;if(av)aviso('Firma borrada','#64748b');}

// Datos
let aud=[];
try{aud=JSON.parse(localStorage.getItem('auditorias_sara')||'[]');}catch(e){aud=[];}
function leer(){
 const d={id:Date.now(),tienda:$('tienda').value.trim(),ciudad:$('ciudad').value.trim(),fecha:$('fecha').value||hoy(),obs:$('obs').value.trim(),firma:firmado?cv.toDataURL('image/png'):null,items:{}};
 ITEMS.forEach(([k,t])=>{d.items[k]={t:t,e:est[k],n:est[k]==='Falla'?notas[k]:'',f:est[k]==='Falla'?fotos[k].slice():[]};});
 return d;
}
let guardando=false;
async function guardar(){
 if(guardando)return;
 const d=leer();
 if(!d.tienda){aviso('⚠️ Escribe el nombre de la tienda','#dc2626');return;}
 guardando=true;aviso('📍 Obteniendo ubicación...','#2563eb');
 const g=await ubicacion();
 if(!g&&!confirm('No se pudo obtener la ubicación GPS (revisa el permiso de ubicación). ¿Guardar igual, sin ubicación?')){guardando=false;return}
 d.gps=g;
 aud.push(d);
 try{localStorage.setItem('auditorias_sara',JSON.stringify(aud));}
 catch(e){aud.pop();guardando=false;aviso('❌ No se pudo guardar: el celular no tiene espacio o no lo permite. Genera el PDF y borra auditorías antiguas.','#dc2626');return;}
 guardando=false;reset();renderizar();aviso(g?'✅ Auditoría guardada con ubicación':'✅ Auditoría guardada (sin ubicación)');
}
function reset(){
 ['tienda','ciudad','obs'].forEach(i=>$(i).value='');$('fecha').value=hoy();
 armar();limpiarFirma(false);
}

// Historial
function renderizar(){
 if(!aud.length){$('lista').innerHTML='<p style="color:#94a3b8;text-align:center;padding:20px">Aún no hay auditorías guardadas.</p>';return;}
 $('lista').innerHTML=aud.slice().reverse().map(a=>{
  const fa=Object.values(a.items).filter(i=>i.e==='Falla').length;
  return `<div class="it"><b style="color:#93c5fd">${esc(a.tienda)}</b> <small>(${esc(a.ciudad)})</small>
  <span class="tag ${fa?'no':'ok'}">${fa?fa+' falla'+(fa>1?'s':''):'Todo cumple'}</span><br><small>${fmt(a.fecha)} · ${a.gps?'📍 con ubicación':'sin ubicación'}</small>
  <div class="row"><div><button class="btn b" style="margin-top:8px;padding:10px" onclick="pdfId(${a.id})">📄 PDF</button></div>
  <div><button class="btn r" style="margin-top:8px;padding:10px" onclick="borrar(${a.id})">🗑️ Borrar</button></div></div></div>`;}).join('');
}
function borrar(id){
 if(!confirm('¿Borrar esta auditoría?'))return;
 aud=aud.filter(a=>a.id!==id);
 try{localStorage.setItem('auditorias_sara',JSON.stringify(aud));}catch(e){}
 renderizar();aviso('Auditoría borrada','#64748b');
}
function borrarTodo(){
 if(!aud.length||!confirm('¿Borrar TODO el historial? No se puede deshacer.'))return;
 aud=[];try{localStorage.removeItem('auditorias_sara');}catch(e){}
 renderizar();aviso('Historial borrado','#64748b');
}
function cambiar(p,b){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
 document.querySelectorAll('.pg').forEach(g=>g.classList.remove('on'));
 b.classList.add('on');$(p).classList.add('on');
 if(p==='historial')renderizar();else setTimeout(ajustar,80);
}

// PDF (imprimir -> Guardar como PDF)
function pdfActual(){const d=leer();if(!d.tienda){aviso('⚠️ Escribe el nombre de la tienda','#dc2626');return;}armarPdf(d);}

function armarPdf(d){
 let h=`<img class="lg" src="${LOGO}"><h1>Informe de Auditoría Retail</h1><p><b>Tienda:</b> ${esc(d.tienda)}</p><p><b>Ciudad:</b> ${esc(d.ciudad)}</p><p><b>Fecha:</b> ${fmt(d.fecha)}</p><p><b>Ubicación GPS:</b> ${d.gps?`${d.gps.lat}, ${d.gps.lon} (precisión ±${d.gps.acc} m) · ${d.gps.h}`:(d.gps===undefined?'se registra al guardar la auditoría':'no registrada')}</p>
 <table><tr><th>Punto revisado</th><th>Resultado</th><th>Evidencia</th></tr>`;
 Object.values(d.items).forEach(i=>{
  const ok=i.e==='Cumple';
  h+=`<tr><td>${esc(i.t)}</td><td class="${ok?'c':'f'}">${ok?'✔ Cumple':'✘ Falla'}</td><td>${esc(i.n)}<div class="ph">${i.f.map(s=>`<img src="${s}">`).join('')}</div></td></tr>`;
 });
 h+=`</table><p><b>Observaciones:</b> ${esc(d.obs)||'Sin observaciones'}</p>`;
 if(d.firma)h+=`<p style="margin-top:16px"><b>Firma del auditor:</b></p><img class="fi" src="${d.firma}">`;
 $('imp').innerHTML=h;
 setTimeout(()=>window.print(),600);
}

let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('ins').style.display='block';});
window.addEventListener('appinstalled',()=>{$('ins').style.display='none';aviso('✅ Aplicación instalada');});
function instalar(){if(!dp)return;dp.prompt();dp.userChoice.then(()=>{dp=null;$('ins').style.display='none';});}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register("auditoria-sw.js").catch(()=>{}));
$('fecha').value=hoy();armar();
setTimeout(ajustar,100);
</script>
